<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigiTrace Settings</title>

    <link rel="stylesheet" href="../css/settings.css">

</head>

<body>

<div class="container">

    <h1>⚙ Account Settings</h1>

    <!-- ================= PROFILE SETTINGS ================= -->

    <form id="settingsForm">

        <label>Full Name</label>
        <input
            type="text"
            id="fullName"
            required>

        <label>Email</label>
        <input
            type="email"
            id="email"
            required>

        <label>Phone Number</label>
        <input
            type="text"
            id="phone"
            required>

        <label>Profile Photo</label>
        <input
            type="file"
            id="profilePhoto"
            accept="image/*">

        <button type="submit">

            Save Changes

        </button>

    </form>

    <hr>

    <!-- ================= CHANGE PASSWORD ================= -->

    <h2>🔒 Change Password</h2>

    <form id="passwordForm">

        <label>Current Password</label>

        <input
            type="password"
            id="oldPassword"
            required>

        <label>New Password</label>

        <input
            type="password"
            id="newPassword"
            required>

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            required>

        <button type="submit">

            Change Password

        </button>

    </form>

    <br>

    <button
        type="button"
        onclick="window.location.href='dashboard.html'">

        Back Dashboard

    </button>

</div>

<script src="../js/settings.js"></script>

</body>

</html>
